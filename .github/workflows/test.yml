name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate behavioral benchmark
        run: python scripts/validate_evals.py evals/benchmark.json
      - name: Validate judge-label format
        run: python scripts/score_judges.py evals/labels.example.jsonl --split test
      - name: Verify archived concision calculations (not a behavioral pass gate)
        run: |
          python scripts/summarize_concision_run.py evals/concision-rerun-2026-09-22/stage-1/experiment.json --check-summary evals/concision-rerun-2026-09-22/stage-1/summary.json
          python scripts/summarize_concision_run.py evals/concision-rerun-2026-09-22/stage-2/experiment.json --check-summary evals/concision-rerun-2026-09-22/stage-2/summary.json
      - name: Verify writing-brief regression record
        run: python evals/brief-refresh-2026-09-22/recompute.py --check
      - name: Verify recent-systems regression record
        run: python evals/recent-systems-2026-09-22/recompute.py
      - name: Compile scripts
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Check auditor version
        run: python scripts/audit_text.py --version
